<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prelim Physics Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js?v=1.0.1"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        /* =========================================
           1. MERGED STYLE.CSS
           ========================================= */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; overflow: hidden; }
        
        /* LOGIN SCREEN */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #e0e0e0; z-index: 10000; 
            display: flex; justify-content: center; align-items: center;
        }
        .login-box {
            background: white; padding: 40px; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15); text-align: center;
            width: 90%; max-width: 400px;
        }
        .login-box h2 { margin-top: 0; color: #333; }
        .login-box p { color: #666; margin-bottom: 20px; }
        .login-box input {
            width: 100%; padding: 12px; margin: 10px 0;
            border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box;
            outline: none; transition: border 0.3s;
        }
        .login-box input:focus { border-color: #007bff; }
        .login-box button {
            width: 100%; padding: 12px; background: #007bff; color: white;
            border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer;
            transition: background 0.3s;
        }
        .login-box button:hover { background: #0056b3; }
        .error { 
            color: #d9534f; margin-top: 15px; display: none; 
            background: #f9d6d5; border: 1px solid #d9534f; padding: 10px;
            font-size: 13px; border-radius: 4px; text-align: left;
        }
        .status { color: #0275d8; margin-top: 15px; font-size: 14px; font-weight: 500; display: block; }

        /* MAIN APP LAYOUT */
        #main-container { display: none; flex-direction: column; height: 100vh; }
        #upper-panel { flex: 1; display: flex; flex-direction: column; min-height: 150px; }
        #lower-panel { height: 300px; min-height: 100px; overflow-y: auto; background: white; }
        #dragger { height: 5px; background: #ccc; cursor: ns-resize; border-top: 1px solid #aaa; border-bottom: 1px solid #aaa; }
        
        /* CONTROLS BAR */
        #controls { 
            padding: 10px; background: #f4f4f4; display: flex; 
            align-items: center; gap: 10px; flex-wrap: wrap; 
            border-bottom: 1px solid #ddd; 
        }
        #pdf-viewer-container { flex: 1; background: #525659; position: relative; }
        #pdf-viewer { width: 100%; height: 100%; border: none; }
        #ms-viewer { width: 100%; height: 100%; border: none; display: none; }
        .split-view { display: flex; height: 100%; }
        .split-view iframe { flex: 1; height: 100%; }
        .split-view #ms-viewer { display: block; border-left: 2px solid #444; }
        
        /* TABLE STYLES */
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f8f9fa; cursor: pointer; position: sticky; top: 0; user-select: none; }
        th:hover { background-color: #e2e6ea; }
        tbody tr:hover { background-color: #e2e6ea; cursor: pointer; }
        
        /* FILTER BUTTONS & DROPDOWNS */
        .dropdown-check-container { position: relative; display: inline-block; }
        .filter-button { 
            padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; 
            background: white; min-width: 60px; display: flex; 
            justify-content: space-between; align-items: center; cursor: pointer;
        }
        .dropdown-panel { 
            display: none; position: absolute; background: white; 
            border: 1px solid #ccc; box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            z-index: 100; min-width: 200px; padding: 10px; border-radius: 4px; 
        }
        .dropdown-list { max-height: 250px; overflow-y: auto; border-bottom: 1px solid #eee; margin-bottom: 10px; }
        .dropdown-list label { display: block; padding: 6px; cursor: pointer; }
        .dropdown-list label:hover { background-color: #f4f4f4; }
        .apply-button { 
            width: 100%; padding: 8px; background: #007bff; color: white; 
            border: none; border-radius: 4px; cursor: pointer;
        }
        .apply-button:hover { background-color: #0056b3; }
        
        /* CUSTOM WIDTHS */
        #year-filter-btn, #jc-filter-btn, #paper-filter-btn, #question-filter-btn { min-width: 60px; }
        #topic-filter-btn { min-width: 300px; }

        .nav-link {
            text-decoration: none;
            color: white;
            background-color: #3437eb;
            padding: 8px 2px;
            border-radius: 4px;
            font-weight: bold;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        .nav-link:hover { background-color: #6365f7; }
        
        #generate-html-btn { 
            background-color: #28a745; color: white; padding: 8px 2px; 
            border: none; border-radius: 4px; font-weight: bold; 
            cursor: pointer; font-size: 14px; 
        }
        #generate-html-btn:hover { background-color: #218838; }
        
        #file-count-display { font-weight: bold; color: #555; margin-left: 10px; }

        /* TABLE COLUMNS */
        #data-table th:nth-child(1), #data-table td:nth-child(1) { width: 15%; } /* Filename */
        #data-table th:nth-child(2), #data-table td:nth-child(2) { width: 5%; }  /* Year */
        #data-table th:nth-child(3), #data-table td:nth-child(3) { width: 5%; }  /* JC */
        #data-table th:nth-child(4), #data-table td:nth-child(4) { width: 5%; }  /* Paper */
        #data-table th:nth-child(5), #data-table td:nth-child(5) { width: 5%; }  /* Question */

        /* MS checkbox styling */
        .ms-toggle {
            display: inline-flex;
            align-items: center;
            margin-left: 10px;
            font-size: 14px;
            cursor: pointer;
            background: #e9ecef;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        .ms-toggle input { margin-right: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>Restricted Access</h2>
            <p>Enter password to unlock prelim papers</p>
            <p>Clear Browser Cache for latest updates</p>
            <input type="password" id="pass-input" placeholder="Password" onkeypress="handleEnter(event)">
            <button onclick="unlock()">Login</button>
            <div id="status-msg" class="status">Initializing...</div>
            <div id="error-msg" class="error"></div>
        </div>
    </div>

    <div id="main-container">
        <div id="upper-panel">
            <div id="controls">
                <div class="dropdown-check-container">
                    <button id="year-filter-btn" class="filter-button">Year (<span id="year-filter-count">0</span>)</button>
                    <div id="year-filter-panel" class="dropdown-panel">
                        <div id="year-filter-list" class="dropdown-list"></div>
                        <button id="year-filter-apply" class="apply-button">Apply</button>
                    </div>
                </div>
                <div class="dropdown-check-container">
                    <button id="jc-filter-btn" class="filter-button">JC (<span id="jc-filter-count">0</span>)</button>
                    <div id="jc-filter-panel" class="dropdown-panel">
                        <div id="jc-filter-list" class="dropdown-list"></div>
                        <button id="jc-filter-apply" class="apply-button">Apply</button>
                    </div>
                </div>
                <div class="dropdown-check-container">
                    <button id="paper-filter-btn" class="filter-button">Paper (<span id="paper-filter-count">0</span>)</button>
                    <div id="paper-filter-panel" class="dropdown-panel">
                        <div id="paper-filter-list" class="dropdown-list"></div>
                        <button id="paper-filter-apply" class="apply-button">Apply</button>
                    </div>
                </div>
                <div class="dropdown-check-container">
                    <button id="question-filter-btn" class="filter-button">Question (<span id="question-filter-count">0</span>)</button>
                    <div id="question-filter-panel" class="dropdown-panel">
                        <div id="question-filter-list" class="dropdown-list"></div>
                        <button id="question-filter-apply" class="apply-button">Apply</button>
                    </div>
                </div>
                <div class="dropdown-check-container">
                    <button id="topic-filter-btn" class="filter-button">Topic (<span id="topic-filter-count">0</span>)</button>
                    <div id="topic-filter-panel" class="dropdown-panel">
                        <div id="topic-filter-list" class="dropdown-list"></div>
                        <button id="topic-filter-apply" class="apply-button">Apply</button>
                    </div>
                </div>
                <label style="display:inline-flex;align-items:center;margin-left:10px;font-size:14px;">
                    <input type="checkbox" id="include-other-topics" />
                    <span style="margin-left:4px;">"Other Topics"</span>
                </label>
                
                <!-- MS TOGGLE -->
                <label class="ms-toggle">
                    <input type="checkbox" id="ms-toggle-checkbox"> MS
                </label>

                <button id="generate-html-btn">HTML</button>
                <button id="merge-pdf-btn" style="background-color: #007bff; color: white; padding: 8px 2px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px;">PDFs</button>
                <button id="download-zip-btn" style="background-color: #ff9800; color: white; padding: 8px 2px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px;">ZIP</button>
                <span id="file-count-display"></span>
                
                <a href="https://sialaichai.github.io/physics9702/" class="nav-link" style="margin-left:auto;">9702</a>
                <a href="https://sialaichai.github.io/physicsseab/" class="nav-link">SEAB</a>
                <a href="https://sialaichai.github.io/physynoptic/" class="nav-link">Data</a>
            </div>
            <div id="pdf-viewer-container">
                <div id="pdf-viewer-wrapper" style="display:flex; height:100%;">
                    <iframe id="pdf-viewer" src="" frameborder="0" style="flex:1; height:100%;"></iframe>
                    <iframe id="ms-viewer" src="" frameborder="0" style="flex:1; height:100%; display:none; border-left:2px solid #444;"></iframe>
                </div>
            </div>
        </div>

        <div id="dragger"></div>

        <div id="lower-panel">
            <table id="data-table">
                <thead>
                    <tr>
                        <th>Filename</th>
                        <th>Year</th>
                        <th>JC</th>
                        <th>Paper</th>
                        <th>Question</th>
                        <th>Main Topic</th>
                        <th>Other Topics</th>
                    </tr>
                </thead>
                <tbody id="data-table-body"></tbody>
            </table>
        </div>
    </div> 

    <script>
    // ======================================================
    // 2. MERGED & UPDATED SCRIPT.JS
    // ======================================================
    
    // CONFIGURATION
    const PAYLOAD_FILE = 'payload.enc';
    const UPDATES_FILE = 'updates.json'; 
    const MS_JSON_FILE = 'ms.json';
    let PDF_FOLDER = ''; 
    let ENCRYPTED_TEXT = '';
    let msLookup = {};  // { "year_JC_paper": true } for quick lookup

    const statusEl = document.getElementById('status-msg');
    const errorEl = document.getElementById('error-msg');

    function logError(msg) {
        errorEl.style.display = 'block';
        errorEl.textContent = msg;
        statusEl.style.display = 'none';
        console.error(msg);
    }

    function logStatus(msg) {
        statusEl.textContent = msg;
        statusEl.style.display = 'block';
        errorEl.style.display = 'none';
    }

    // 1. PRELOAD ENCRYPTED DATA
    logStatus("Loading secure data...");
    
    fetch(PAYLOAD_FILE)
        .then(res => {
            if(!res.ok) throw new Error(`Fetch Failed: ${res.status} ${res.statusText}`);
            return res.text();
        })
        .then(text => { 
            if (!text || text.length === 0) throw new Error("payload.enc is EMPTY.");
            ENCRYPTED_TEXT = text.trim();
            logStatus(`Ready.`);
            
            const savedPass = sessionStorage.getItem('prelim_session_key');
            if(savedPass) {
                logStatus("Restoring Session...");
                document.getElementById('pass-input').value = savedPass;
                unlock(true); 
            }
        })
        .catch(err => {
            logError("Error: Could not find 'payload.enc'.\nDid you upload it to GitHub?");
        });

    function handleEnter(e) { if(e.key === 'Enter') unlock(); }

    // 2. UNLOCK FUNCTION
    function unlock(isAuto = false) {
        const passInput = document.getElementById('pass-input');
        const pass = passInput.value;
        
        if (!pass) { if(!isAuto) logError("Please enter a password."); return; }
        if (!ENCRYPTED_TEXT) { logError("Data not loaded."); return; }

        if(!isAuto) logStatus("Decrypting...");

        setTimeout(() => {
            try {
                const bytes = CryptoJS.AES.decrypt(ENCRYPTED_TEXT, pass);
                if (bytes.sigBytes < 0) throw new Error("Decryption Key Mismatch.");
                
                let decryptedStr = bytes.toString(CryptoJS.enc.Utf8);
                if (!decryptedStr) throw new Error("Incorrect Password.");

                let bundle = JSON.parse(decryptedStr);
                
                sessionStorage.setItem('prelim_session_key', pass);
                PDF_FOLDER = bundle.secure_folder;
                let mainData = bundle.data;

                // Load ms.json
                logStatus("Loading mark scheme data...");
                fetch(MS_JSON_FILE)
                    .then(res => {
                        if (res.status === 404) { 
                            console.warn("ms.json not found. Mark scheme feature disabled.");
                            return [];
                        }
                        if (!res.ok) throw new Error("Failed to load ms.json");
                        return res.json();
                    })
                    .then(msData => {
                        // Build lookup: key = "year_jc_paper" (case-insensitive)
                        msLookup = {};
                        if (Array.isArray(msData)) {
                            msData.forEach(item => {
                                const year = (item.year || '').trim();
                                const jc = (item.jc || item.JC || '').trim(); // Handle both 'jc' and 'JC'
                                const paper = (item.paper || '').trim();
                                if (year && jc && paper) {
                                    const key = `${year}_${jc}_${paper}`.toLowerCase();
                                    msLookup[key] = true;
                                    console.log(`MS lookup: ${key}`);
                                }
                            });
                        }
                        console.log(`MS lookup built with ${Object.keys(msLookup).length} entries.`);
                        console.log('MS Lookup keys:', Object.keys(msLookup));
                        
                        // Check for updates
                        logStatus("Checking for updates...");
                        fetch(UPDATES_FILE)
                            .then(res => {
                                if (res.status === 404) return []; 
                                if (!res.ok) throw new Error("Update check failed");
                                return res.json();
                            })
                            .then(updateData => {
                                if(Array.isArray(updateData) && updateData.length > 0) {
                                    console.log(`Merging ${updateData.length} new items.`);
                                    mainData = mainData.concat(updateData);
                                }
                                startApp(mainData);
                                document.getElementById('login-screen').style.display = 'none';
                                document.getElementById('main-container').style.display = 'flex';
                            })
                            .catch(err => {
                                console.warn("Update fetch error:", err);
                                startApp(mainData);
                                document.getElementById('login-screen').style.display = 'none';
                                document.getElementById('main-container').style.display = 'flex';
                            });
                    })
                    .catch(err => {
                        console.warn("ms.json error:", err);
                        // Continue without MS
                        startApp(mainData);
                        document.getElementById('login-screen').style.display = 'none';
                        document.getElementById('main-container').style.display = 'flex';
                    });

            } catch (e) {
                if(isAuto) {
                    sessionStorage.removeItem('prelim_session_key');
                    passInput.value = '';
                    logStatus("Session expired. Please login.");
                } else {
                    logError(e.message);
                }
            }
        }, 100);
    }

    // 3. MAIN APP LOGIC
    function startApp(allData) {
        
        // --- STATE VARIABLES ---
        let selectedTopics = new Set();
        let selectedYears = new Set();
        let selectedJCs = new Set();
        let selectedPapers = new Set();
        let selectedQuestions = new Set();
        let msEnabled = false; // MS toggle state
        
        const tableBody = document.getElementById('data-table-body');
        const pdfViewer = document.getElementById('pdf-viewer');
        const msViewer = document.getElementById('ms-viewer');
        const fileCountDisplay = document.getElementById('file-count-display');
        const msToggle = document.getElementById('ms-toggle-checkbox');

        // --- NORMALIZE DATA ---
        allData = allData.map(item => {
            let q = (item.question || '').trim();
            q = q.replace(/\.pdf$/i, '').replace(/^q0+(\d)/i, 'q$1');
            return {
                filename: (item.filename || '').trim(),
                year: (item.year || '').trim(),
                jc: (item.jc || '').trim(),
                paper: (item.paper || '').trim(),
                question: q, 
                mainTopic: (item.mainTopic || '').trim(),
                otherTopics: Array.isArray(item.otherTopics) ? item.otherTopics.map(t => t.trim()).filter(t => t !== "") : []
            };
        });

        // --- Sort State & Listeners ---
        let currentFilteredData = [...allData]; 
        let currentSort = { column: 1, asc: false };
        const baseHeaders = ['Filename', 'Year', 'JC', 'Paper', 'Question', 'Main Topic', 'Other Topics'];
        const headers = document.querySelectorAll('#data-table th');
        
        headers.forEach((th, index) => {
            th.addEventListener('click', () => {
                if (currentSort.column === index) {
                    currentSort.asc = !currentSort.asc;
                } else {
                    currentSort.column = index;
                    currentSort.asc = false;
                }
                renderTable(currentFilteredData);
            });
        });

        populateDropdowns(allData);
        setupEventListeners(allData);
        renderTable(currentFilteredData);

        // --- MS Toggle Handler ---
        msToggle.addEventListener('change', function() {
            msEnabled = this.checked;
            // If MS is enabled, check if current PDF has an MS and show it
            const currentSrc = pdfViewer.src;
            if (msEnabled && currentSrc) {
                // Extract filename from src (remove base path)
                const parts = currentSrc.split('/');
                const fname = parts[parts.length - 1];
                if (fname) {
                    const match = fname.match(/^(.+)_q\d+\.pdf$/i);
                    if (match) {
                        const base = match[1];
                        const msFile = `${base}_q1_ms.pdf`; // placeholder, will match any qx
                        const msUrl = currentSrc.replace(/[^/]+$/, msFile);
                        // Check if ms exists via lookup
                        const keyParts = fname.replace(/\.pdf$/i,'').split('_');
                        if (keyParts.length >= 3) {
                            const year = keyParts[0];
                            const jc = keyParts[1];
                            const paper = keyParts[2];
                            const lookupKey = `${year}_${jc}_${paper}`.toLowerCase();
                            console.log(`Checking MS for: ${lookupKey}`);
                            if (msLookup[lookupKey]) {
                                msViewer.src = msUrl;
                                msViewer.style.display = 'block';
                                pdfViewer.style.flex = '1';
                                msViewer.style.flex = '1';
                            } else {
                                msViewer.src = '';
                                msViewer.style.display = 'none';
                                pdfViewer.style.flex = '1';
                            }
                        }
                    }
                }
            } else {
                msViewer.src = '';
                msViewer.style.display = 'none';
                pdfViewer.style.flex = '1';
            }
        });

        function populateDropdowns(data) {
            const getUniques = (mapper, sorter) => [...new Set(data.map(mapper).flat().filter(Boolean))].sort(sorter);
            
            const naturalSort = (a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
            const yearSort = (a, b) => {
                const numA = parseInt(a.replace(/\D/g, '')) || 0;
                const numB = parseInt(b.replace(/\D/g, '')) || 0;
                return numA !== numB ? numB - numA : b.localeCompare(a);
            };

            const topics = getUniques(i => i.mainTopic.split(/[;,]/).map(s=>s.trim()), undefined);
            const years = getUniques(i => i.year, yearSort);
            const jcs = getUniques(i => i.jc, undefined);
            const papers = getUniques(i => i.paper, undefined);
            const questions = getUniques(i => i.question, naturalSort);

            const setupList = (id, arr, cls) => {
                const el = document.getElementById(id);
                if(!el) return; el.innerHTML = '';
                arr.forEach(v => {
                    const l = document.createElement('label');
                    const c = document.createElement('input'); c.type='checkbox'; c.className=cls; c.value=v;
                    l.appendChild(c); l.appendChild(document.createTextNode(' '+v)); el.appendChild(l);
                });
            }
            setupList('topic-filter-list', topics, 'topic-checkbox');
            setupList('year-filter-list', years, 'year-checkbox');
            setupList('jc-filter-list', jcs, 'jc-checkbox');
            setupList('paper-filter-list', papers, 'paper-checkbox');
            setupList('question-filter-list', questions, 'question-checkbox');
        }

        function setupEventListeners(data) {
            const setup = (btnId, panelId, listId, applyId, set, cls) => {
                const btn = document.getElementById(btnId), panel = document.getElementById(panelId);
                const list = document.getElementById(listId), apply = document.getElementById(applyId);
                if(!btn) return;
                btn.addEventListener('click', () => panel.style.display = panel.style.display === 'block' ? 'none' : 'block');
                apply.addEventListener('click', () => {
                    set.clear(); list.querySelectorAll(`.${cls}:checked`).forEach(b => set.add(b.value));
                    btn.children[0].textContent = set.size; panel.style.display = 'none'; applyFilters(data);
                });
            };
            setup('topic-filter-btn', 'topic-filter-panel', 'topic-filter-list', 'topic-filter-apply', selectedTopics, 'topic-checkbox');
            setup('year-filter-btn', 'year-filter-panel', 'year-filter-list', 'year-filter-apply', selectedYears, 'year-checkbox');
            setup('jc-filter-btn', 'jc-filter-panel', 'jc-filter-list', 'jc-filter-apply', selectedJCs, 'jc-checkbox');
            setup('paper-filter-btn', 'paper-filter-panel', 'paper-filter-list', 'paper-filter-apply', selectedPapers, 'paper-checkbox');
            setup('question-filter-btn', 'question-filter-panel', 'question-filter-list', 'question-filter-apply', selectedQuestions, 'question-checkbox');

            document.addEventListener('click', (e) => {
                ['topic-filter-panel', 'year-filter-panel', 'jc-filter-panel', 'paper-filter-panel', 'question-filter-panel'].forEach(id => {
                    const p = document.getElementById(id);
                    if(p && !p.contains(e.target) && !e.target.closest('.filter-button')) p.style.display='none';
                });
            });

            // --- HTML GENERATE ---
            const genBtn = document.getElementById('generate-html-btn');
            genBtn.addEventListener('click', () => {
                const rows = tableBody.querySelectorAll('tr');
                if(rows.length > 100 && !confirm(`Generate report for ${rows.length} files? Browser may crash.`)) return;
                
                const pdfBaseUrl = `https://sialaichai.github.io/physicsprelim/${PDF_FOLDER}/`;
                let html = `<!DOCTYPE html><html><head><title>Report</title><style>body{font-family:sans-serif;margin:20px;background:#f4f4f4}h1{text-align:center}.pdf-section{margin-bottom:40px;background:#fff;padding:15px;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}.header-row{font-size:1.2em;margin-bottom:10px;border-bottom:1px solid #eee;padding-bottom:5px}embed{width:100%;height:800px;border:1px solid #ccc}.ms-embed{width:100%;height:800px;border:1px solid #aaa;margin-top:10px}</style></head><body><h1>Filtered PDF Report</h1>`;
                
                rows.forEach(r => {
                    const fname = r.cells[0].textContent;
                    const year = r.cells[1].textContent;
                    const mainTopic = r.cells[5].textContent;
                    const keyParts = fname.replace(/\.pdf$/i,'').split('_');
                    let msUrl = '';
                    if (msEnabled && keyParts.length >= 3) {
                        const lookupKey = `${keyParts[0]}_${keyParts[1]}_${keyParts[2]}`.toLowerCase();
                        if (msLookup[lookupKey]) {
                            const base = fname.replace(/\.pdf$/i,'');
                            const msFile = `${base}_ms.pdf`;
                            msUrl = `${pdfBaseUrl}${year}/${msFile}`;
                        }
                    }
                    
                    html += `
                        <div class='pdf-section'>
                            <div class='header-row'>
                                <b>${fname}</b> <span style="color:#666; font-size:0.9em;">(${mainTopic})</span>
                            </div>
                            <embed src='${pdfBaseUrl}${year}/${fname}' type='application/pdf' />
                            ${msUrl ? `<div style="margin-top:10px;font-weight:bold;color:#0066cc;">Mark Scheme</div><embed class="ms-embed" src='${msUrl}' type='application/pdf' />` : ''}
                        </div>
                    `;
                });
                html += `</body></html>`;
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([html], {type:'text/html'}));
                a.download = 'filtered_report.html'; a.click();
            });

            // --- MERGE PDF (linear banner style) ---
            const mergeBtn = document.getElementById('merge-pdf-btn');
            mergeBtn.addEventListener('click', async () => {
                const rows = Array.from(tableBody.querySelectorAll('tr'));
                if (rows.length === 0) { alert("No files to merge."); return; }
                if (rows.length > 50 && !confirm(`Merging ${rows.length} PDFs may crash browser. Continue?`)) return;

                const originalBtnText = mergeBtn.textContent;
                mergeBtn.textContent = "Processing...";
                mergeBtn.disabled = true;

                try {
                    const { PDFDocument, rgb, StandardFonts } = PDFLib;
                    const mergedPdf = await PDFDocument.create();
                    const font = await mergedPdf.embedFont(StandardFonts.HelveticaBold);
                    const pdfBaseUrl = `https://sialaichai.github.io/physicsprelim/${PDF_FOLDER}/`;

                    for (let i = 0; i < rows.length; i++) {
                        const r = rows[i];
                        const fname = r.cells[0].textContent;
                        const year = r.cells[1].textContent;

                        mergeBtn.textContent = `Merging ${i + 1}/${rows.length}...`;

                        // Main PDF
                        const fileUrl = `${pdfBaseUrl}${year}/${fname}`;
                        const res = await fetch(fileUrl);
                        if (!res.ok) { console.error(`Failed to fetch ${fname}`); continue; }
                        const existingPdfBytes = await res.arrayBuffer();
                        const sourcePdf = await PDFDocument.load(existingPdfBytes);
                        
                        const firstPage = sourcePdf.getPages()[0];
                        const { width } = firstPage.getSize();

                        // Banner for main file
                        const bannerPage = mergedPdf.addPage([width, 30]);
                        bannerPage.drawText(`File: ${fname}`, {
                            x: 15, y: 15, size: 10, font: font, color: rgb(1, 0, 0),
                        });
                        const copiedPages = await mergedPdf.copyPages(sourcePdf, sourcePdf.getPageIndices());
                        copiedPages.forEach((page) => mergedPdf.addPage(page));

                        // MS PDF if enabled and exists
                        if (msEnabled) {
                            const keyParts = fname.replace(/\.pdf$/i,'').split('_');
                            if (keyParts.length >= 3) {
                                const lookupKey = `${keyParts[0]}_${keyParts[1]}_${keyParts[2]}`.toLowerCase();
                                if (msLookup[lookupKey]) {
                                    const base = fname.replace(/\.pdf$/i,'');
                                    const msFile = `${base}_ms.pdf`;
                                    const msUrl = `${pdfBaseUrl}${year}/${msFile}`;
                                    const msRes = await fetch(msUrl);
                                    if (msRes.ok) {
                                        const msBytes = await msRes.arrayBuffer();
                                        const msPdf = await PDFDocument.load(msBytes);
                                        const msBanner = mergedPdf.addPage([width, 30]);
                                        msBanner.drawText(`Mark Scheme: ${msFile}`, {
                                            x: 15, y: 15, size: 10, font: font, color: rgb(0, 0, 1),
                                        });
                                        const msPages = await mergedPdf.copyPages(msPdf, msPdf.getPageIndices());
                                        msPages.forEach((page) => mergedPdf.addPage(page));
                                    }
                                }
                            }
                        }
                    }

                    mergeBtn.textContent = "Finalizing...";
                    const pdfBytes = await mergedPdf.save();
                    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = `merged_physics_${new Date().toISOString().slice(0,10)}.pdf`;
                    link.click();

                } catch (err) {
                    console.error(err);
                    alert("Error merging:\n" + err.message);
                } finally {
                    mergeBtn.textContent = originalBtnText;
                    mergeBtn.disabled = false;
                }
            });

            // --- ZIP DOWNLOAD ---
            const zipBtn = document.getElementById('download-zip-btn');
            zipBtn.addEventListener('click', async () => {
                const rows = Array.from(tableBody.querySelectorAll('tr'));
                if (rows.length === 0) { alert("No files to zip."); return; }
                if (rows.length > 100 && !confirm(`Zipping ${rows.length} files might take a while. Continue?`)) return;

                const originalBtnText = zipBtn.textContent;
                zipBtn.disabled = true;

                try {
                    const zip = new JSZip();
                    const pdfBaseUrl = `https://sialaichai.github.io/physicsprelim/${PDF_FOLDER}/`;

                    for (let i = 0; i < rows.length; i++) {
                        const r = rows[i];
                        const fname = r.cells[0].textContent;
                        const year = r.cells[1].textContent;

                        zipBtn.textContent = `Fetching ${i + 1}/${rows.length}...`;

                        const fileUrl = `${pdfBaseUrl}${year}/${fname}`;
                        const res = await fetch(fileUrl);
                        if (res.ok) {
                            const blob = await res.blob();
                            zip.file(fname, blob);
                        } else {
                            console.error(`Failed to fetch ${fname}`);
                        }

                        // MS if enabled
                        if (msEnabled) {
                            const keyParts = fname.replace(/\.pdf$/i,'').split('_');
                            if (keyParts.length >= 3) {
                                const lookupKey = `${keyParts[0]}_${keyParts[1]}_${keyParts[2]}`.toLowerCase();
                                if (msLookup[lookupKey]) {
                                    const base = fname.replace(/\.pdf$/i,'');
                                    const msFile = `${base}_ms.pdf`;
                                    const msUrl = `${pdfBaseUrl}${year}/${msFile}`;
                                    const msRes = await fetch(msUrl);
                                    if (msRes.ok) {
                                        const msBlob = await msRes.blob();
                                        zip.file(msFile, msBlob);
                                    }
                                }
                            }
                        }
                    }

                    zipBtn.textContent = "Zipping...";
                    const content = await zip.generateAsync({ type: "blob" });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(content);
                    link.download = `prelim_papers_${new Date().toISOString().slice(0,10)}.zip`;
                    link.click();
                    URL.revokeObjectURL(link.href);

                } catch (err) {
                    console.error(err);
                    alert("Error creating zip:\n" + err.message);
                } finally {
                    zipBtn.textContent = originalBtnText;
                    zipBtn.disabled = false;
                }
            });
        }

        function applyFilters(data) {
            let fd = [...data];
            if (selectedTopics.size > 0) {
                const includeOther = document.getElementById('include-other-topics').checked;
                fd = fd.filter(item => {
                    if (selectedTopics.has(item.mainTopic)) return true;
                    if (includeOther && item.otherTopics.some(t => selectedTopics.has(t))) return true;
                    return false;
                });
            }
            if (selectedYears.size > 0) fd = fd.filter(i => selectedYears.has(i.year));
            if (selectedJCs.size > 0) fd = fd.filter(i => selectedJCs.has(i.jc));
            if (selectedPapers.size > 0) fd = fd.filter(i => selectedPapers.has(i.paper));
            if (selectedQuestions.size > 0) fd = fd.filter(i => selectedQuestions.has(i.question));
            currentFilteredData = fd;
            renderTable(currentFilteredData);
        }

        function renderTable(data) {
            const headers = document.querySelectorAll('#data-table th');
            headers.forEach((th, index) => {
                if (currentSort.column === index) {
                    th.textContent = baseHeaders[index] + (currentSort.asc ? ' ▲' : ' ▼');
                } else {
                    th.textContent = baseHeaders[index];
                }
            });

            data.sort((a, b) => {
                const keys = ['filename', 'year', 'jc', 'paper', 'question', 'mainTopic', 'otherTopics'];
                const key = keys[currentSort.column];
                let valA = a[key] || '';
                let valB = b[key] || '';
                if (key === 'year') {
                    valA = parseInt(valA.toString().replace(/\D/g, '')) || 0;
                    valB = parseInt(valB.toString().replace(/\D/g, '')) || 0;
                    return currentSort.asc ? valA - valB : valB - valA;
                }
                if (key === 'otherTopics') {
                    valA = valA.join(', ');
                    valB = valB.join(', ');
                }
                return currentSort.asc 
                    ? String(valA).localeCompare(String(valB), undefined, { numeric: true, sensitivity: 'base' })
                    : String(valB).localeCompare(String(valA), undefined, { numeric: true, sensitivity: 'base' });
            });

            tableBody.innerHTML = '';
            const fragment = document.createDocumentFragment();
            const displayData = data.length > 500 ? data.slice(0, 500) : data;
            
            displayData.forEach(r => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${r.filename}</td>
                    <td>${r.year}</td>
                    <td>${r.jc}</td>
                    <td>${r.paper}</td>
                    <td>${r.question}</td>
                    <td>${r.mainTopic}</td>
                    <td>${r.otherTopics.join(', ')}</td>
                `;
                tr.addEventListener('click', () => {
                    const pdfBaseUrl = `https://sialaichai.github.io/physicsprelim/${PDF_FOLDER}/`;
                    const pdfUrl = `${pdfBaseUrl}${r.year}/${r.filename}`;
                    pdfViewer.src = pdfUrl;
                    pdfViewer.style.flex = '1';
                    // Check MS
                    if (msEnabled) {
                        const keyParts = r.filename.replace(/\.pdf$/i,'').split('_');
                        if (keyParts.length >= 3) {
                            const lookupKey = `${keyParts[0]}_${keyParts[1]}_${keyParts[2]}`.toLowerCase();
                            console.log(`Row click - Checking MS for: ${lookupKey}`);
                            if (msLookup[lookupKey]) {
                                const base = r.filename.replace(/\.pdf$/i,'');
                                const msFile = `${base}_ms.pdf`;
                                const msUrl = `${pdfBaseUrl}${r.year}/${msFile}`;
                                msViewer.src = msUrl;
                                msViewer.style.display = 'block';
                                pdfViewer.style.flex = '1';
                                msViewer.style.flex = '1';
                            } else {
                                msViewer.src = '';
                                msViewer.style.display = 'none';
                                pdfViewer.style.flex = '1';
                            }
                        }
                    } else {
                        msViewer.src = '';
                        msViewer.style.display = 'none';
                        pdfViewer.style.flex = '1';
                    }
                });
                fragment.appendChild(tr);
            });
            tableBody.appendChild(fragment);
            fileCountDisplay.textContent = data.length > 500 ? `Top 500/${data.length}` : `${data.length} files`;
        }

        // Dragger Resizer
        const dragger = document.getElementById('dragger');
        const lowerPanel = document.getElementById('lower-panel');
        if(dragger && lowerPanel) {
            let isD = false;
            dragger.addEventListener('mousedown', () => { isD = true; document.body.style.userSelect = 'none'; if(pdfViewer) pdfViewer.style.pointerEvents = 'none'; });
            document.addEventListener('mouseup', () => { isD = false; document.body.style.userSelect = 'auto'; if(pdfViewer) pdfViewer.style.pointerEvents = 'auto'; });
            document.addEventListener('mousemove', (e) => { if(isD) lowerPanel.style.height = `${window.innerHeight - e.clientY - 2.5}px`; });
        }
    }
    </script>
</body>
</html>
